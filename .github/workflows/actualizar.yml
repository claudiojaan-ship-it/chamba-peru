name: Actualizar convocatorias

on:
  schedule:
    - cron: "0 11 * * *"   # 6:00 a. m. hora de Perú
    - cron: "0 23 * * *"   # 6:00 p. m. hora de Perú
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", "site/img/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: pip install pillow

      - name: Descargar, verificar enlaces y generar la página
        env:
          PY: python3 -P
        run: bash tools/update.sh

      - name: Guardar el historial de convocatorias vistas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/seen.json work/logos.json
          git diff --cached --quiet || git commit -m "Actualización $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
